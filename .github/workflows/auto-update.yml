# 🍺 Auto-update — sync `Formula/beeping-cli.rb` to a new beeping-cli release.
#
# BEE-1782 — the canonical release flow:
#
#   1. `beeping-io/beeping-cli` publishes a tag `v<X.Y.Z>` via release-please.
#   2. That repo's `release.yml` builds + signs + publishes assets
#      (including `SHA256SUMS` with one line per cross-platform binary).
#   3. After publish, beeping-cli fires a `repository_dispatch` event with
#      `event_type=beeping-cli-released` and `client_payload={tag,version}`
#      to THIS repo.
#   4. This workflow downloads `SHA256SUMS` for that tag, rewrites
#      `Formula/beeping-cli.rb` with the real per-target SHA256 hashes
#      + the new version, and commits to `develop`.
#
# Solo-developer note: pushes directly to `develop` (no PR cycle) because
# the diff is mechanically generated + the regen script is deterministic.
# If a regen step fails, the workflow exits non-zero — the formula
# stays at whatever version was last successfully synced.

name: 🍺 Auto-update beeping-cli formula

on:
  repository_dispatch:
    types: [beeping-cli-released]
  workflow_dispatch:
    inputs:
      tag:
        description: "beeping-cli release tag (with leading 'v', e.g. v0.1.2)"
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: auto-update-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    name: 🔄 Regenerate Formula/beeping-cli.rb
    runs-on: ubuntu-latest
    steps:
      - name: 🛂 Checkout tap
        uses: actions/checkout@v5
        with:
          ref: develop
          # default GITHUB_TOKEN has contents: write per permissions block;
          # commits authored as github-actions[bot] are allowed by tap
          # branch settings (no required reviews on the solo-dev tap repo).
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Resolve tag + version
        id: tag
        env:
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${DISPATCH_TAG:-$INPUT_TAG}"
          if [ -z "$TAG" ]; then
            echo "::error::No tag provided (dispatch nor input)"
            exit 1
          fi
          # Strip leading 'v' for the formula's `version` field
          VERSION="${TAG#v}"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Updating to tag=$TAG version=$VERSION"

      - name: ⬇️ Download SHA256SUMS for the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" \
            --repo beeping-io/beeping-cli \
            --pattern SHA256SUMS \
            --output SHA256SUMS \
            --clobber
          echo '--- SHA256SUMS ---'
          cat SHA256SUMS
          echo '--- end ---'

      - name: 🔄 Regenerate formula
        run: |
          python3 scripts/regen-formula.py \
            --formula Formula/beeping-cli.rb \
            --sha256sums SHA256SUMS \
            --version "${{ steps.tag.outputs.version }}"

      - name: 🧪 Validate Ruby syntax
        run: ruby -c Formula/beeping-cli.rb

      - name: 🧪 Brew style (if Homebrew available)
        # `brew style` requires Homebrew on the runner. ubuntu-latest does
        # NOT have it pre-installed; this step is best-effort and won't
        # block the auto-update if brew is missing. The ruby -c above
        # is the hard gate.
        continue-on-error: true
        run: |
          if command -v brew >/dev/null 2>&1; then
            brew style Formula/beeping-cli.rb
          else
            echo "::notice::brew not available on this runner; skipping brew style"
          fi

      - name: 💾 Commit + push (if changed)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if git diff --quiet Formula/beeping-cli.rb; then
            echo "::notice::Formula already up-to-date for $TAG; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/beeping-cli.rb
          MSG="chore(formula): sync beeping-cli to ${TAG} (BEE-1782) — auto-generated by .github/workflows/auto-update.yml"
          git commit -m "$MSG"
          git push origin develop
